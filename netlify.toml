[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.19.0"

# Skip deploy for release-please PRs
[context.deploy-preview]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . || [ \"$HEAD\" != \"${HEAD#release-please--}\" ]"

# Long-lived browser cache for Netlify Image CDN transforms — URL+params are
# immutable per image, safe to cache aggressively
[[headers]]
  for = "/.netlify/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Remote sources the Netlify Image CDN may fetch (logos on Cloudinary). Without this entry
# /.netlify/images refuses the URL. Scoped to our own cloud so the CDN cannot be used as an
# open proxy for other Cloudinary accounts.
[images]
  remote_images = ["https://res\\.cloudinary\\.com/dsmtyu2iw/image/upload/.*"]
